<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sneaker District | Tenis originales en México</title>
  <meta name="description" content="Tenis originales de Nike, Adidas, New Balance, Off-White, Yeezy y más. Elige tu par, pide por WhatsApp y recibe en todo México.">
  <meta name="theme-color" content="#1C1C1E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
  <script defer src="products.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- 1. Header: usa el tema del hero -->
  <header class="site-header">
    <div class="wrap site-header__bar">
      <a class="logo" href="#inicio">Sneaker District</a>
      <nav class="site-header__nav" id="menu" aria-label="Secciones">
        <a href="#lanzamientos">Lanzamientos</a>
        <a href="#mas-vendidos">Más vendidos</a>
        <a href="#como-comprar">Cómo comprar</a>
        <a href="#preguntas">Preguntas</a>
      </nav>
      <div class="site-header__actions">
        <a class="btn btn--theme btn--sm site-header__cta" href="https://wa.me/" data-wa-contact target="_blank" rel="noopener">Escríbenos</a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="20" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="contenido">
    <!-- 2. Hero -->
    <section class="hero" id="inicio" aria-label="Tenis destacados">
      <div class="wrap">
        <h1 class="hero__name">Air Jordan 1 High</h1>
      </div>
    </section>

    <!-- 3. Marcas -->
    <section class="section brands" aria-labelledby="marcas-titulo">
      <div class="wrap">
        <h2 class="visually-hidden" id="marcas-titulo">Marcas</h2>
      </div>
    </section>

    <!-- 4. Lanzamientos -->
    <section class="section section--alt" id="lanzamientos" aria-labelledby="lanzamientos-titulo">
      <div class="wrap">
        <h2 id="lanzamientos-titulo">Lanzamientos</h2>
      </div>
    </section>

    <!-- 5. Más vendidos -->
    <section class="section" id="mas-vendidos" aria-labelledby="vendidos-titulo">
      <div class="wrap">
        <h2 id="vendidos-titulo">Más vendidos</h2>
      </div>
    </section>

    <!-- 6. Garantía de originalidad -->
    <section class="section section--dark guarantee" id="garantia" aria-labelledby="garantia-titulo">
      <div class="wrap">
        <h2 id="garantia-titulo">Originales o nada.</h2>
      </div>
    </section>

    <!-- 7. Cómo comprar y envíos -->
    <section class="section" id="como-comprar" aria-labelledby="comprar-titulo">
      <div class="wrap">
        <h2 id="comprar-titulo">Cómo comprar</h2>
      </div>
    </section>

    <!-- 8. Reseñas -->
    <section class="section section--alt" id="resenas" aria-labelledby="resenas-titulo">
      <div class="wrap">
        <h2 id="resenas-titulo">Lo que dicen nuestros clientes</h2>
      </div>
    </section>

    <!-- 9. Preguntas frecuentes -->
    <section class="section" id="preguntas" aria-labelledby="preguntas-titulo">
      <div class="wrap">
        <h2 id="preguntas-titulo">Preguntas frecuentes</h2>
      </div>
    </section>

    <!-- 10. Avísame del próximo drop -->
    <section class="section section--dark" id="avisame" aria-labelledby="avisame-titulo">
      <div class="wrap">
        <h2 id="avisame-titulo">Avísame del próximo drop</h2>
      </div>
    </section>
  </main>

  <!-- 11. Footer + botón flotante de WhatsApp (fase 9) -->
  <footer class="site-footer"></footer>
</body>
</html>
