<style>
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  --bg: #0D0A22;
  --ink: #180F3C;
  --btn: #F2B8C0;
  --btn-hover: #F7C9D0;
  /* u: the smaller of vw/1440 and vh/900 (1px at 1440×900), floored so tablet-width nav text stays legible */
  --u: max(min(100vw / 1440, 100vh / 900), .7px);
}
@supports (height: 100svh) {
  :root { --u: max(min(100vw / 1440, 100svh / 900), .7px); }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: #fff;
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---------- Hero and stage ---------- */
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 520px;
  background: var(--bg);
  container-type: size;
}

/* 16:9 box that always covers the hero, centred both ways */
.stage,
.opening {
  --sw: max(100cqw, 100cqh * 16 / 9);
  --sh: calc(var(--sw) * 9 / 16);
}
.stage {
  position: absolute;
  width: var(--sw);
  height: var(--sh);
  left: calc(50cqw - var(--sw) / 2);
  top: calc(50cqh - var(--sh) / 2);
  margin: 0;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.layer { position: absolute; inset: 0; }
.layer > img,
.layer > video {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.layer-back { transform-origin: 50% 40%; }
.layer-mid { transform-origin: 50% 45%; }
.layer-front { transform-origin: 50% 100%; }

.rain {
  opacity: 0;
  transition: opacity .7s linear;
}
.rain.on { opacity: 1; }

.shade {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 45%;
  background: linear-gradient(to bottom, rgba(13, 8, 40, .45), rgba(13, 8, 40, 0));
}

/* Glass tint: between the posts, from the top rail down to the floor */
.glass {
  position: absolute;
  left: 5.2%;
  right: 4.1%;
  top: 57.9%;
  height: 25.4%;
  background: linear-gradient(to bottom, rgba(190, 200, 255, .10), rgba(150, 160, 230, .05) 60%, rgba(120, 130, 210, .08));
  -webkit-backdrop-filter: blur(1.2px) saturate(1.05);
  backdrop-filter: blur(1.2px) saturate(1.05);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
}

/* ---------- Headline ---------- */
.headline {
  --F: calc(min(var(--sw) * .625, 92cqw) / 3.43);
  --base: 43%;
  --asc: .864;
  position: absolute;
  top: 0;
  height: 100%;
  width: 100cqw;
  left: calc(50% - 50cqw);
}
.word {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--base) - var(--F) * var(--asc));
  margin: 0;
  font-size: var(--F);
  font-weight: 700;
  letter-spacing: -.045em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  color: #fff;
}
.word span { display: inline-block; }
.kicker {
  position: absolute;
  top: calc(var(--base) - var(--F) * .747);
  left: calc(var(--F) * -.1);
  right: calc(var(--F) * .1);
  margin: 0;
  font-size: calc(var(--F) * .118);
  font-weight: 300;
  letter-spacing: -.01em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  color: #fff;
}
.measure {
  position: absolute;
  top: 0;
  left: -10000px;
  right: auto;
  width: max-content;
  font-size: 100px;
  visibility: hidden;
  pointer-events: none;
}
.measure i { display: inline-block; width: 0; height: 0; }

@media (max-aspect-ratio: 5/6) {
  .headline { --base: 36.2%; }
}

/* ---------- Opening (aerial + tilt) and doors ---------- */
.opening {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}
.opening > img,
.opening > video {
  position: absolute;
  display: block;
  width: var(--sw);
  height: var(--sh);
  left: calc(50% - var(--sw) / 2);
  top: calc(50% - var(--sh) / 2);
  object-fit: cover;
}
.tilt { opacity: 0; }

.doors {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
}
.door {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background-color: var(--bg);
  background-repeat: no-repeat;
  background-size: 200% 100%;
}
.door-l { left: 0; background-position: 0 50%; }
.door-r { right: 0; background-position: 100% 50%; }

/* ---------- Nav ---------- */
.nav {
  position: absolute;
  z-index: 10;
  top: calc(52 * var(--u));
  left: 0;
  right: 0;
  height: calc(48 * var(--u));
  padding: 0 calc(125 * var(--u));
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: calc(15 * var(--u));
  line-height: 1;
}
.nav a { color: inherit; text-decoration: none; }
.brand {
  font-size: calc(17 * var(--u));
  font-weight: 600;
  letter-spacing: .28em;
  color: #fff;
  white-space: nowrap;
}
.pills {
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: calc(5 * var(--u));
  border-radius: 999px;
  background: rgba(255, 255, 255, .14);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
}
.pills a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: calc(38 * var(--u));
  padding: 0 calc(22 * var(--u));
  border-radius: 999px;
  color: rgba(255, 255, 255, .88);
  font-weight: 400;
  white-space: nowrap;
  transition: background-color .25s;
}
.pills a:hover { background-color: rgba(255, 255, 255, .14); }
.pills a[aria-current="page"] {
  background-color: #fff;
  color: var(--ink);
  font-weight: 600;
}
.nav-right {
  display: flex;
  align-items: center;
  gap: calc(30 * var(--u));
}
.lang {
  display: inline-flex;
  align-items: center;
  gap: calc(9 * var(--u));
  padding: 0;
  border: 0;
  background: none;
  color: rgba(255, 255, 255, .9);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}
.lang svg {
  display: block;
  width: calc(20 * var(--u));
  height: calc(20 * var(--u));
  flex: none;
}
.enquire {
  display: inline-flex;
  align-items: center;
  height: calc(44 * var(--u));
  padding: 0 calc(27 * var(--u));
  border-radius: 999px;
  background-color: var(--btn);
  color: var(--ink) !important;
  font-weight: 600;
  white-space: nowrap;
  transition: transform .25s, background-color .25s;
}
.enquire:hover {
  transform: translateY(-1px);
  background-color: var(--btn-hover);
}
.nav a:focus-visible,
.lang:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

/* ---------- Intro start states (until the clock takes over) ---------- */
.hero.intro .nav > *,
.hero.intro .kicker,
.hero.intro .word span,
.hero.intro .shade { opacity: 0; }
.hero.intro .layer-front { transform: translateY(66%); }
.hero.intro .door,
.hero.intro .layer,
.hero.intro .headline { will-change: transform; }

/* ---------- Small screens ---------- */
@media (max-width: 819.98px) {
  :root { --u: 1px; }
  .nav {
    top: 16px;
    height: auto;
    padding: 0 18px;
    flex-wrap: wrap;
    row-gap: 12px;
  }
  .brand { font-size: 14px; letter-spacing: .22em; }
  .lang { font-size: 13px; }
  .lang svg { width: 16px; height: 16px; }
  .enquire { height: 36px; padding: 0 16px; font-size: 13px; }
  .pills {
    position: static;
    order: 3;
    width: 100%;
    height: 40px;
    padding: 4px;
    transform: none;
  }
  .pills a {
    flex: 1 1 auto;
    height: 32px;
    padding: 0 10px;
    font-size: 12px;
  }
}
@media (max-width: 360px) {
  .pills a { font-size: 11px; padding: 0 6px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  :root { --u: 1px; }
  .nav {
    top: 12px;
    height: 34px;
    padding: 0 24px;
    flex-wrap: nowrap;
    font-size: 12px;
  }
  .brand { font-size: 13px; }
  .nav-right { gap: 14px; }
  .lang { font-size: 12px; gap: 6px; }
  .lang svg { width: 15px; height: 15px; }
  .enquire { height: 32px; padding: 0 14px; font-size: 12px; }
  .pills {
    position: absolute;
    left: 50%;
    top: 0;
    order: 0;
    width: auto;
    height: 34px;
    padding: 3px;
    transform: translateX(-50%);
  }
  .pills a {
    flex: none;
    height: 28px;
    padding: 0 11px;
    font-size: 12px;
  }
}
@media (max-height: 500px) and (orientation: landscape) and (max-width: 700px) {
  .pills a { padding: 0 8px; }
}

/* ---------- Reduced motion: the final frame, at once ---------- */
@media (prefers-reduced-motion: reduce) {
  .doors, .opening, .rain { display: none !important; }
  .hero.intro .nav > *,
  .hero.intro .kicker,
  .hero.intro .word span,
  .hero.intro .shade { opacity: 1; }
  .hero.intro .layer-front { transform: none; }
  .enquire:hover { transform: none; }
}
</style>

<body>
<div class="hero intro" id="hero">
  <header class="nav">

    </div>
    <div class="headline">

<script>
(() => {
  'use strict';

  /* ---------- Media ---------- */
  const CDN = 'https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2F';
  const IMG = {
    doors: 'hf_20261117_063048_97fd9a70-adbe-46bd-bfce-ec1004f6c7d8',
    aerial: 'hf_20261117_063055_ee1debcd-d200-484f-b94f-fad6dcffd4eb',
    back: 'hf_20261117_063251_24fbd7cc-00df-49ec-8fbf-d8a0349b1e98',
    mid: 'hf_20261117_063252_b9f2fecf-9be0-485f-842f-3aa6bbc251f2',
    front: 'hf_20261117_063151_7804d758-a2eb-4499-9b56-8f493edbb206'
  };
  const VIDEO = {
    tilt: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063355_a600befc-45d6-4a32-9db6-9d6565a89609.mp4',
    rain: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063703_04e54df7-2236-4dff-b95b-a9a34c1f78ec.mp4'
  };
  const imgURL = (id, w) =>
    'https://images.higgs.ai/?default=1&output=webp&url=' + CDN + id + '.png&w=' + w + '&q=85';

  /* ---------- Elements ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const hero = $('#hero');
  const nav = $('.nav', hero);
  const navParts = Array.from(nav.children);
  const stage = $('.stage', hero);
  const back = $('.layer-back', stage);
  const mid = $('.layer-mid', stage);
  const front = $('.layer-front', stage);
  const shade = $('.shade', back);
  const rainA = $('.rain-a', back);
  const rainB = $('.rain-b', back);
  const headline = $('.headline', stage);
  const kicker = $('.kicker', headline);
  const word = $('.word', headline);
  const letters = Array.from(word.children);
  const opening = $('.opening', hero);
  const aerial = $('.aerial', opening);
  const tilt = $('.tilt', opening);
  const doors = $('.doors', hero);
  const doorL = $('.door-l', doors);
  const doorR = $('.door-r', doors);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Stage geometry and image sizing ---------- */
  function geom() {
    const W = hero.clientWidth;
    const H = hero.clientHeight;
    const sw = Math.max(W, H * 16 / 9);
    const sh = sw * 9 / 16;
    return { W, H, sw, sh, top: (H - sh) / 2 };
  }
  // 1x: the needed width rounded up to the next hundred. HiDPI: 2000 covers a 1600-wide stage.
  function pickW(cssWidth) {
    const dpr = window.devicePixelRatio || 1;
    const need = dpr > 1.05 ? Math.max(2000, cssWidth * 1.25) : cssWidth;
    return Math.min(2700, Math.max(100, Math.ceil(need / 100) * 100));
  }

  const layerImgs = [[$('img', back), IMG.back], [$('img', mid), IMG.mid], [$('img', front), IMG.front]];
  let layerW = pickW(geom().sw);
  for (const [el, id] of layerImgs) el.src = imgURL(id, layerW);

  /* ---------- Headline sizing ---------- */
  const meas = document.createElement('div');
  meas.className = 'word measure';
  meas.setAttribute('aria-hidden', 'true');
  meas.innerHTML = letters.map((l) => '<span>' + l.textContent + '</span>').join('') + '<i></i>';
  hero.appendChild(meas);

  let perEm = 3.43;   // word width per em
  let asc = 0.864;    // baseline offset from the top of the line box, per em
  function measure() {
    const w = meas.getBoundingClientRect().width;
    if (w > 0) {
      perEm = w / 100;
      asc = meas.lastChild.offsetTop / 100;
    }
  }
  function layout() {
    const g = geom();
    const base = (g.H > 1.2 * g.W ? 0.362 : 0.43) * g.sh;   // baseline, in stage px
    const navBottom = nav.offsetTop + nav.offsetHeight;      // layout box, unaffected by the intro transform
    const size = Math.max(12, Math.min(
      0.625 * g.sw / perEm,
      0.92 * g.W / perEm,
      (g.top + base - (navBottom + 0.035 * g.H)) / 0.88
    ));
    headline.style.setProperty('--F', size.toFixed(2) + 'px');
    headline.style.setProperty('--base', base.toFixed(2) + 'px');
    headline.style.setProperty('--asc', asc.toFixed(4));
  }
  measure();
  layout();
  const fontReady = document.fonts && document.fonts.load
    ? document.fonts.load('700 100px "Inter"').catch(() => {})
    : Promise.resolve();
  fontReady.then(() => { measure(); layout(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); layout(); });

  // Sharper images if the stage grows (window maximised, rotation)
  let upgradeTimer = 0;
  function upgradeImages() {
    const w = pickW(geom().sw);
    if (w <= layerW) return;
    layerW = w;
    for (const [el, id] of layerImgs) {
      const next = new Image();
      next.src = imgURL(id, w);
      next.decode().then(() => { el.src = next.src; }, () => {});
    }
  }
  let resizeFrame = 0;
  const onResize = () => {
    if (!resizeFrame) resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; layout(); });
    clearTimeout(upgradeTimer);
    upgradeTimer = setTimeout(upgradeImages, 400);
  };
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(hero);
  else window.addEventListener('resize', onResize);

  /* ---------- Reduced motion: final frame, no videos ---------- */
  if (reduce) {
    hero.classList.remove('intro');
    opening.hidden = true;
    doors.hidden = true;
    rainA.remove();
    rainB.remove();
    tilt.remove();
    return;
  }

  /* ---------- Opening media ---------- */
  const doorURL = imgURL(IMG.doors, pickW(geom().W));
  const doorImg = new Image();
  doorImg.fetchPriority = 'high';
  doorImg.src = doorURL;
  doorL.style.backgroundImage = doorR.style.backgroundImage = 'url("' + doorURL + '")';

  aerial.fetchPriority = 'high';
  aerial.src = imgURL(IMG.aerial, layerW);
  tilt.muted = true;
  tilt.src = VIDEO.tilt;
  for (const v of [rainA, rainB]) v.muted = true;

  /* ---------- Master timeline (7.4 s, one clock) ---------- */
  const D = 7400;
  const anims = [];
  const off = (s) => Math.min(1, Math.max(0, (s * 1000) / D));
  // pts: [[seconds, {prop: value}, easing to the next point], ...]
  function track(el, pts) {
    const kf = [];
    const first = pts[0];
    const last = pts[pts.length - 1];
    if (first[0] > 0) kf.push(Object.assign({ offset: 0 }, first[1]));
    for (const [t, v, e] of pts) kf.push(Object.assign({ offset: off(t), easing: e || 'linear' }, v));
    if (last[0] * 1000 < D) kf.push(Object.assign({ offset: 1 }, last[1]));
    const a = el.animate(kf, { duration: D, fill: 'both' });
    a.pause();
    a.currentTime = 0;
    anims.push(a);
  }
  const tY = (v) => ({ transform: 'translateY(' + v + ')' });
  const tX = (v) => ({ transform: 'translateX(' + v + ')' });
  const op = (v) => ({ opacity: v });
  const rise = 'cubic-bezier(.2,.65,.3,1)';

  track(doorL, [[0.02, tX('0'), 'cubic-bezier(.1,.2,.8,1)'], [1.13, tX('-101%')]]);
  track(doorR, [[0.02, tX('0'), 'cubic-bezier(.4,.6,.9,1)'], [1.24, tX('101%')]]);
  track(tilt, [[1.19, op(0), 'ease-in-out'], [1.47, op(1)]]);
  track(opening, [[2.45, op(1), 'cubic-bezier(.45,0,.55,1)'], [2.95, op(0)]]);
  // Nav: the slide is on the bar; the fade is on its three groups (same look, and the
  // pill bar's backdrop blur keeps sampling the sky while it fades in)
  track(nav, [[2.45, tY('-6px'), 'ease-out'], [2.75, tY('0')]]);
  for (const part of navParts) track(part, [[2.45, op(0), 'ease-out'], [2.75, op(1)]]);
  track(kicker, [
    [2.45, { opacity: 0, transform: 'translateY(.5em)' }, rise],
    [3.10, { opacity: 1, transform: 'translateY(0)' }]
  ]);
  letters.forEach((el, i) => {
    const t = 2.45 + i * 0.054;
    track(el, [
      [t, { opacity: 0, transform: 'translateY(.14em)' }, rise],
      [t + 0.70, { opacity: 1, transform: 'translateY(0)' }]
    ]);
  });
  track(shade, [[2.90, op(0), 'ease-in-out'], [3.70, op(1)]]);
  track(back, [[2.90, tY('0'), 'cubic-bezier(.45,0,.35,1)'], [4.30, tY('-1.5%')]]);
  track(mid, [
    [2.90, tY('0'), 'cubic-bezier(.45,0,.3,1)'],
    [4.30, tY('-4%')],
    [4.60, tY('-4%'), 'cubic-bezier(.45,0,.55,1)'],
    [6.90, tY('0')]
  ]);
  track(headline, [[3.00, tY('6%'), 'cubic-bezier(.3,0,.4,1)'], [4.80, tY('0')]]);
  track(front, [
    [3.35, tY('66%'), 'cubic-bezier(.2,.5,.2,1)'],
    [6.00, tY('-2.5%'), 'cubic-bezier(.45,0,.55,1)'],
    [7.30, tY('0')]
  ]);

  /* ---------- Tilt video: the whole clip inside 1.25 → 2.85 s ---------- */
  const W0 = 1.25;
  const W1 = 2.85;
  let tiltStarted = false;
  let tiltDone = false;
  let tiltScrub = false;   // autoplay refused (e.g. low-power mode): seek frame by frame instead
  const clipLength = () => (isFinite(tilt.duration) && tilt.duration > 0 ? tilt.duration : 5.0417);
  function driveTilt(s) {
    if (tiltDone || s < W0) return;
    const dur = clipLength();
    if (s >= W1) {
      tiltDone = true;
      tilt.pause();
      try { tilt.currentTime = Math.max(0, dur - 0.02); } catch (e) { /* not seekable yet */ }
      return;
    }
    const base = dur / (W1 - W0);
    const target = ((s - W0) / (W1 - W0)) * dur;
    if (!tiltStarted) {
      tiltStarted = true;
      tilt.playbackRate = base;
      const p = tilt.play();
      if (p && p.catch) p.catch(() => { if (!tiltDone) tiltScrub = true; });
      return;
    }
    if (tiltScrub) {
      if (!tilt.seeking) { try { tilt.currentTime = target; } catch (e) { /* ignore */ } }
      return;
    }
    // Nudge the rate toward the master clock, clamped to 0.85–1.2 × the base rate
    const k = Math.min(1.2, Math.max(0.85, 1 + (target - tilt.currentTime) * 1.5));
    const rate = base * k;
    if (Math.abs(tilt.playbackRate - rate) > base * 0.01) tilt.playbackRate = rate;
  }

  /* ---------- Rain loop: two copies, 0.7 s crossfades, first 3.6 s only ---------- */
  const LOOP = 3.6;
  const XFADE = 0.75;
  let rainOn = false;
  let active = null;
  const play = (v) => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  function swap() {
    const prev = active;
    const next = prev === rainA ? rainB : rainA;
    active = next;
    next.currentTime = 0;
    play(next);
    next.classList.add('on');
    prev.classList.remove('on');
    setTimeout(() => {
      if (prev === active) return;
      prev.pause();
      prev.currentTime = 0;   // parked on its first frame, ready for the next swap
    }, 800);
  }
  function check(v, time) {
    if (v === active && time >= LOOP - XFADE) swap();
  }
  for (const v of [rainA, rainB]) {
    v.addEventListener('timeupdate', () => check(v, v.currentTime));
    v.addEventListener('ended', () => { if (v === active) swap(); });
    if ('requestVideoFrameCallback' in v) {
      const onFrame = (now, meta) => { check(v, meta.mediaTime); v.requestVideoFrameCallback(onFrame); };
      v.requestVideoFrameCallback(onFrame);
    }
  }
  function startRain() {
    rainOn = true;
    active = rainA;
    rainA.currentTime = 0;
    rainA.classList.add('on');
    play(rainA);
  }

  /* ---------- Clock ---------- */
  let started = false;
  let t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    const t = Math.min(D, Math.max(0, now - t0));
    for (const a of anims) a.currentTime = t;
    const s = t / 1000;
    if (!rainOn && s >= 2.4) startRain();
    driveTilt(s);
    if (t >= D) finish();
    else requestAnimationFrame(frame);
  }
  function finish() {
    for (const a of anims) a.cancel();
    anims.length = 0;
    hero.classList.remove('intro');
    opening.hidden = true;
    doors.hidden = true;
    doorL.style.backgroundImage = doorR.style.backgroundImage = '';
    tilt.pause();
    tilt.removeAttribute('src');
    tilt.load();
  }
  function start() {
    if (started) return;
    started = true;
    rainA.src = VIDEO.rain;
    rainB.src = VIDEO.rain;
    requestAnimationFrame(frame);
  }

  /* ---------- Start once everything is ready (+120 ms), or at 5 s regardless ---------- */
  function ready(el) {
    return new Promise((resolve) => {
      if (el.tagName === 'VIDEO') {
        if (el.readyState >= 4) return resolve();
        el.addEventListener('canplaythrough', resolve, { once: true });
        el.addEventListener('error', resolve, { once: true });
        return;
      }
      const wait = () => {
        if (el.complete) return resolve();
        el.addEventListener('load', resolve, { once: true });
        el.addEventListener('error', resolve, { once: true });
      };
      if (el.decode) el.decode().then(resolve, wait);
      else wait();
    });
  }
  Promise.all([ready(doorImg), ready(aerial)]
    .concat(layerImgs.map(([el]) => ready(el)), ready(tilt), fontReady))
    .then(() => setTimeout(start, 120));
  setTimeout(start, 5000);
})();
</script>
</body>
</html>
